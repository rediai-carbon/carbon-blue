name: windows-blue-v145

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: windows-blue-v145
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout this Blue head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Confirm the v145 toolset and its ATL header
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $default = Get-ChildItem "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.v145.default.txt" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $default) {
            Write-Output "V145_DEFAULT_FILE_MISSING"
            Get-ChildItem "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion*.txt" | ForEach-Object { Write-Output $_.Name; Get-Content $_.FullName }
            exit 1
          }
          $ver = (Get-Content $default.FullName -Raw).Trim()
          Write-Output "V145_COMPILER=$ver"
          $atl = Join-Path $vs "VC\Tools\MSVC\$ver\atlmfc\include\atlbase.h"
          if (-not (Test-Path $atl)) { Write-Output "V145_ATL_MISSING $atl"; exit 1 }
          Write-Output "V145_ATL=$atl"

      - name: Fetch the pinned registry and bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git init C:\reg
          git -C C:\reg remote add origin https://github.com/rediai-carbon/carbon-vcpkg-registry.git
          git -C C:\reg fetch --depth 1 origin 3548d22bf31e2c0359e447aaa9ef19821b6fae01
          git -C C:\reg checkout --detach FETCH_HEAD
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          cmd /c C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path C:\overlay | Out-Null
          Get-ChildItem C:\reg\ports -Directory | ForEach-Object {
            $portfile = Join-Path $_.FullName "portfile.cmake"
            if ((Test-Path $portfile) -and (Select-String -Path $portfile -Pattern "git@github.com:" -Quiet)) {
              Copy-Item $_.FullName (Join-Path C:\overlay $_.Name) -Recurse
            }
          }
          Get-ChildItem C:\overlay -Recurse -Filter portfile.cmake | ForEach-Object {
            $text = [System.IO.File]::ReadAllText($_.FullName)
            $text = $text.Replace("git@github.com:", "https://github.com/")
            [System.IO.File]::WriteAllText($_.FullName, $text)
          }
          $pins = @{
            "carbon-core" = @("https://github.com/rediai-carbon/carbon-core.git", "beffc4ee091358ea755f5dcb553c60f43e278768")
            "carbon-scheduler" = @("https://github.com/rediai-carbon/carbon-scheduler.git", "7a4070383f783b9d0d6f436ad8b6e2c2adef6230")
            "carbon-io" = @("https://github.com/rediai-carbon/carbon-io.git", "e7ebe5f2636f570a1eedc3a50930fd2a348279ac")
            "carbon-exefile" = @("https://github.com/rediai-carbon/carbon-exefile.git", "bf2c480d6433dce8a7b274a2b5b3f431f9ce76aa")
            "carbon-blueexposure" = @("https://github.com/rediai-carbon/carbon-blueexposure.git", "5710645741adf743b06940c280c117df6e1fd10e")
          }
          foreach ($name in $pins.Keys) {
            $dest = Join-Path C:\overlay $name
            if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
            Copy-Item (Join-Path C:\reg\ports $name) $dest -Recurse
            $portfile = Join-Path $dest "portfile.cmake"
            if ($name -eq "carbon-core" -or $name -eq "carbon-exefile") {
              $fixed = "https://raw.githubusercontent.com/rediai-carbon/carbon-vcpkg-registry/fcd2296bf8b37385e639c642be2375d0f5077941/ports/$name/portfile.cmake"
              Invoke-WebRequest -Uri $fixed -OutFile $portfile
              Write-Output "HOST_BUILD_TYPE_PORTFILE $name fcd2296bf8b37385e639c642be2375d0f5077941"
            }
            $text = [System.IO.File]::ReadAllText($portfile)
            $text = $text.Replace("git@github.com:", "https://github.com/")
            $text = [regex]::Replace($text, "URL\s+\S+", ("URL " + $pins[$name][0]), 1)
            $text = [regex]::Replace($text, "REF\s+\S+", ("REF " + $pins[$name][1]), 1)
            [System.IO.File]::WriteAllText($portfile, $text)
            Write-Output ("PINNED_SOURCE " + $name + " " + $pins[$name][1])
          }
          $ports = @(Get-ChildItem C:\overlay -Directory | ForEach-Object { $_.FullName.Replace("\", "/") })
          $joined = $ports -join ";"
          $pre = @(
            'set(VCPKG_TARGET_TRIPLET "x64-windows-145-release" CACHE STRING "")',
            'set(VCPKG_OVERLAY_TRIPLETS "C:/reg/triplets" CACHE STRING "")',
            ('set(VCPKG_OVERLAY_PORTS "{0}" CACHE STRING "")' -f $joined),
            'set(CMAKE_TOOLCHAIN_FILE "C:/vcpkg/scripts/buildsystems/vcpkg.cmake" CACHE STRING "")'
          )
          New-Item -ItemType Directory -Force -Path C:\b | Out-Null
          $pre | Set-Content -Path C:\b\pre.cmake -Encoding ascii
          Write-Output "OVERLAY_PORTS=$joined"

      - name: Restore the vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: C:\vcpkg-binary-cache
          key: windows-145-${{ hashFiles('.github/workflows/windows-blue-v145.yml') }}
          restore-keys: |
            windows-145-

      - name: Enter the v145 toolset for the outer build
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          toolset: 14.52

      - name: Configure and build Blue
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH_TO_VCPKG_ROOT = "C:\vcpkg"
          New-Item -ItemType Directory -Force -Path C:\vcpkg-binary-cache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,C:/vcpkg-binary-cache,readwrite"
          $cl = (Get-Command cl.exe).Source
          Write-Output "OUTER_CL=$cl"
          if ($cl -notmatch "\\14\.52\.") { throw "Outer compiler is not the v145 14.52 toolset: $cl" }
          cmake -S $env:GITHUB_WORKSPACE -B C:\b\blue -G Ninja -C C:\b\pre.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$cl" -DCMAKE_CXX_COMPILER="$cl" -DVCPKG_INSTALLED_DIR=C:\b\installed -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compilers = Select-String -Path C:\b\blue\CMakeCache.txt -Pattern "^CMAKE_C_COMPILER:|^CMAKE_CXX_COMPILER:"
          $compilers | ForEach-Object { Write-Output $_.Line }
          $joined = ($compilers | ForEach-Object { $_.Line }) -join "`n"
          if ($joined -match "mingw") { throw "Outer build selected MinGW" }
          if ($joined -notmatch "14\.52") { throw "Outer build did not record the v145 compiler" }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build C:\b\blue --target Blue
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $built = Get-ChildItem C:\b\blue -Recurse -Include blue.dll,blue.pyd,blue.lib | Select-Object -ExpandProperty FullName
          Write-Output "BLUE_ARTIFACTS"
          $built
          if (-not $built) { Write-Output "BLUE_ARTIFACT_MISSING"; exit 1 }
          if (Test-Path C:\b\installed\vcpkg\status) {
            Select-String -Path C:\b\installed\vcpkg\status -Pattern "^Package: |^Version: " | ForEach-Object { $_.Line }
          }
          Get-ChildItem C:\b\installed -Recurse -Include exefile.exe,python.exe,python3*.dll,blue.dll,blue.pyd -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

      - name: Exercise the Windows host runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $triplet = "C:\b\installed\x64-windows-145-release"
          $exe = Get-ChildItem C:\b\blue -Recurse -Filter exefile.exe | Select-Object -First 1
          if (-not $exe) { Write-Output "EXEFILE_MISSING"; exit 1 }
          $python = Get-ChildItem $triplet -Recurse -Filter python.exe | Select-Object -First 1
          if (-not $python) { Write-Output "PYTHON_MISSING"; exit 1 }
          $version = & $python.FullName -c "import sys; print(sys.version)"
          Write-Output "PYTHON $version"
          Write-Output "EXEFILE $($exe.FullName)"
          $stdlib = (& $python.FullName -c "import sysconfig; print(sysconfig.get_path('stdlib'))").Trim()
          Write-Output "PYTHON_STDLIB $stdlib"
          $env:BUILDFLAVOR = "release"
          $runtimePath = "$($exe.DirectoryName);${env:GITHUB_WORKSPACE}\python;$triplet\bin;$triplet\lib;$triplet\bin\python;$stdlib"
          $env:PYTHONPATH = $runtimePath
          $missing = Start-Process -FilePath $exe.FullName -ArgumentList '/nocrashreportupload','/inherit','/buildflavor=release','/py','-c','import fenris_missing_module' -Wait -PassThru -NoNewWindow -RedirectStandardOutput C:\b\init-fail.txt -RedirectStandardError C:\b\init-fail.err
          $fail = $missing.ExitCode
          Get-Content C:\b\init-fail.txt, C:\b\init-fail.err
          Write-Output "INIT_FAILURE_EXIT=$fail"
          if ($fail -eq 0 -or $fail -ge 128) { exit 1 }
          $reported = Select-String -Path C:\b\init-fail.txt, C:\b\init-fail.err -Pattern "ModuleNotFoundError"
          if (-not $reported) { Write-Output "INIT_FAILURE_UNREPORTED"; exit 1 }
          $okProc = Start-Process -FilePath $exe.FullName -ArgumentList '/nocrashreportupload','/inherit','/buildflavor=release','/py','-c','import blue, scheduler, _carbonsocket; print(''WIN_RUNTIME_OK'')' -Wait -PassThru -NoNewWindow -RedirectStandardOutput C:\b\runtime.txt -RedirectStandardError C:\b\runtime.err
          $ok = $okProc.ExitCode
          Get-Content C:\b\runtime.txt, C:\b\runtime.err
          Write-Output "WIN_RUNTIME_EXIT=$ok"
          if ($ok -ne 0) { exit $ok }

      - name: Run the discovered Python runtime tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH_TO_VCPKG_ROOT = "C:\vcpkg"
          Set-Location C:\b\blue
          ctest --output-on-failure --timeout 180 -j 2 -E "BlueCppUnitTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the C++ harness
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH_TO_VCPKG_ROOT = "C:\vcpkg"
          cmake --build C:\b\blue --target BlueCppUnitTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location C:\b\blue
          ctest --output-on-failure --timeout 180 -R "BlueCppUnitTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
